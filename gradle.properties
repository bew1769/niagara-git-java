# Non-secret build settings. Put niagara_home and the signing profile path in
# local.properties (gitignored) or in the environment. See README.md.

org.gradle.jvmargs=-Xmx1g
org.gradle.java.installations.auto-detect=true

# Niagara 4.13+ Gradle plugin versions. If resolution fails, set
# gradlePluginVersion to the version directory under
# %NIAGARA_HOME%/etc/m2/repository/com/tridium/niagara-module/
gradlePluginVersion=7.6.22
settingsPluginVersion=7.6.3
